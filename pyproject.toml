[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strata"
version = "0.1.0"
description = "Strata — declarative, versioned, immutable data transformations (compiles to SQL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Strata", email = "hello@strata-lang.org" }]
keywords = ["sql", "data-engineering", "dbt", "duckdb", "data-contracts", "lineage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Database",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "duckdb>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
bigquery = ["google-cloud-bigquery>=3.0"]
snowflake = ["snowflake-connector-python>=3.0"]
airflow = ["apache-airflow>=2.8"]
prefect = ["prefect>=2.14"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "coverage>=7.0",
  "psycopg2-binary>=2.9",
]
all = [
  "psycopg2-binary>=2.9",
  "google-cloud-bigquery>=3.0",
  "snowflake-connector-python>=3.0",
  "apache-airflow>=2.8",
  "prefect>=2.14",
]

[project.urls]
Homepage = "https://github.com/Tzinny-dev/strata"
Repository = "https://github.com/Tzinny-dev/strata"
Issues = "https://github.com/Tzinny-dev/strata/issues"

[project.scripts]
strata = "strata.cli:main"

[tool.setuptools.packages.find]
include = ["strata*"]

[tool.pytest.ini_options]
addopts = "--cov=strata --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
source = ["strata"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
