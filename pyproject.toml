[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-lang"
version = "0.1.5"
description = "Strata — declarative, versioned, immutable data transformations (compiles to SQL)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Strata", email = "hello@strata-lang.org" }]
keywords = ["sql", "data-engineering", "dbt", "duckdb", "data-contracts", "lineage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Database",
]
dependencies = [
  "duckdb>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9,<3.0"]
bigquery = ["google-cloud-bigquery>=3.0,<4.0"]
snowflake = ["snowflake-connector-python>=3.0,<4.0"]
airflow = ["apache-airflow>=2.8,<3.0"]
prefect = ["prefect>=2.14,<3.0"]
portalocker = ["portalocker>=2.8,<3.0"]
iceberg = ["pyiceberg[pyarrow]>=0.7,<1.0"]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "coverage>=7.0,<8.0",
  "psycopg2-binary>=2.9,<3.0",
  "ruff>=0.16.0,<0.17",
  "mypy>=1.10.0,<2.0",
  "hypothesis>=6.90,<7.0",
]
all = [
  "psycopg2-binary>=2.9,<3.0",
  "google-cloud-bigquery>=3.0,<4.0",
  "snowflake-connector-python>=3.0,<4.0",
  "apache-airflow>=2.8,<3.0",
  "prefect>=2.14,<3.0",
  "portalocker>=2.8,<3.0",
]

[project.urls]
Homepage = "https://github.com/Tzinny-dev/strata"
Repository = "https://github.com/Tzinny-dev/strata"
Issues = "https://github.com/Tzinny-dev/strata/issues"

[project.scripts]
strata = "strata.cli:main"

[tool.setuptools.packages.find]
include = ["strata*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Explicit selection: ruff 0.16 raised the default set from 59 to 413 rules,
# which turns `ruff check` into a de-facto style rewrite. We pin the classic
# error-focused set here and grow it deliberately.
select = ["E4", "E7", "E9", "F"]
# E402: several modules import after sys.path / logging setup on purpose.
# E702/E731: compact `a; b` statements and lambda bindings are established style here.
ignore = ["E402", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
# strata/cli.py is a re-export facade (backward-compat: `from strata.cli import cmd_run`).
"strata/cli.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "--cov=strata --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
source = ["strata"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
