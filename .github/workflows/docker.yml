name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tzinny-dev/strata:${{ steps.meta.outputs.version }}
            ghcr.io/tzinny-dev/strata:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build-time smoke already in Dockerfile RUN strata --help etc.

      - name: Smoke pull
        run: |
          docker pull ghcr.io/tzinny-dev/strata:${{ steps.meta.outputs.version }}
          docker run --rm ghcr.io/tzinny-dev/strata:${{ steps.meta.outputs.version }} --help
          docker run --rm ghcr.io/tzinny-dev/strata:${{ steps.meta.outputs.version }} build examples/daily_orders.strata
