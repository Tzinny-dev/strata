name: binary

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: strata-linux-amd64
            binary: dist/strata
          - os: macos-latest
            artifact: strata-macos-amd64
            binary: dist/strata
          - os: windows-latest
            artifact: strata-windows-amd64
            binary: dist/strata.exe
          # arm64 roadmap (uncomment when runners available / demand proven):
          # - os: ubuntu-24.04-arm
          #   artifact: strata-linux-arm64
          #   binary: dist/strata
          # - os: macos-14  # arm64 (M1)
          #   artifact: strata-macos-arm64
          #   binary: dist/strata
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install UPX (size hardening)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          upx --version

      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,portalocker]"
          pip install pyinstaller

      - name: Build standalone (spec)
        shell: bash
        run: |
          pyinstaller strata.spec --noconfirm
          ls -lh dist/
          du -h dist/* 2>/dev/null || du -h dist\*
          sha256sum dist/* 2>/dev/null || sha256sum dist\\* 2>/dev/null || shasum -a 256 dist/* 2>/dev/null || Get-FileHash dist\* -Algorithm SHA256 2>/dev/null | cat
          du -h dist/*
          sha256sum dist/* 2>/dev/null || shasum -a 256 dist/*

      - name: Smoke — help
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./dist/strata.exe --help
          else
            ./dist/strata --help
          fi

      - name: Smoke — build + compile
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./dist/strata.exe build examples/daily_orders.strata
            ./dist/strata.exe compile examples/daily_orders.strata --dialect postgres > /tmp/out.sql
          else
            ./dist/strata build examples/daily_orders.strata
            ./dist/strata compile examples/daily_orders.strata --dialect postgres > /tmp/out.sql
          fi
          test -s /tmp/out.sql

      - name: Smoke — run --seed (DuckDB in-memory)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./dist/strata.exe run examples/daily_orders.strata --seed 2>&1 | tail -n 100
          else
            ./dist/strata run examples/daily_orders.strata --seed 2>&1 | tail -n 100
          fi

      - name: Codesign macOS (ad-hoc, no Developer ID — proper signing needs APPLE_CERT)
        if: matrix.os == 'macos-latest'
        run: |
          codesign --sign - --force --deep dist/strata || echo "::warning::codesign ad-hoc failed (needs Apple cert for Gatekeeper)"
          codesign --verify dist/strata 2>&1 | head -n 5 || true
          # Without real Developer ID, Gatekeeper will still warn — document in binary-standalone.md Fase 3

      - name: Smoke — bench
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./dist/strata.exe bench
          else
            ./dist/strata bench
          fi

      - name: Gate — binary vs pip parity (linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          echo "pip build > /tmp/pip_build.txt"
          python -m strata build examples/daily_orders.strata > /tmp/pip_build.txt 2>&1 || python -c "from strata.cli import main; import sys; sys.exit(main(['build','examples/daily_orders.strata']))" > /tmp/pip_build.txt
          # fallback via strata entry point if module run fails
          if [ ! -s /tmp/pip_build.txt ]; then strata build examples/daily_orders.strata > /tmp/pip_build.txt; fi
          ./dist/strata build examples/daily_orders.strata > /tmp/bin_build.txt
          diff -u /tmp/pip_build.txt /tmp/bin_build.txt && echo "parity build: OK" || (echo "::error::binary build differs from pip build"; diff -u /tmp/pip_build.txt /tmp/bin_build.txt; exit 1)
          echo "pip bench vs bin bench"
          # pytest is the source of truth for bench parity — run pytest bench harness quickly
          python -m pytest tests/test_bench.py -q 2>&1 | tail -n 20 || echo "::warning::test_bench not found, skipping"
          ./dist/strata bench > /tmp/bin_bench.txt 2>&1
          # at minimum bench must be green on binary (already smoke), parity is build output equality
          # declarative tests via binary must also be green
          ./dist/strata test examples/daily_orders.strata --seed > /tmp/bin_test.txt 2>&1 || (cat /tmp/bin_test.txt; echo "::error::binary strata test failed"; exit 1)
          echo "parity test: OK"

      - name: Report size (hardening gate)
        shell: bash
        run: |
          bin="${{ matrix.binary }}"
          size=$(stat -c%s "$bin" 2>/dev/null || stat -f%z "$bin" 2>/dev/null || wc -c < "$bin")
          mb=$(awk "BEGIN {printf \"%.1f\", $size/1024/1024}")
          echo "binary size: $mb MB ($size bytes) — $bin"
          # soft gate: warn if >120M (spec expected 34M, 80-120M uncompressed, 40-60M UPX)
          if [ "$size" -gt 125829120 ]; then echo "::warning::binary >120M, check bloat"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  compat:
    needs: build
    runs-on: ubuntu-latest
    # verify UPX-compressed linux binary still runs on old glibc (duckdb breaks on <5.10 kernels / glibc <2.28)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strata-linux-amd64
          path: /tmp
      - name: Test on ubuntu:20.04 (glibc 2.31) via Docker
        run: |
          chmod +x /tmp/strata
          docker run --rm -v /tmp/strata:/strata:ro ubuntu:20.04 /strata --help
          docker run --rm -v /tmp/strata:/strata:ro ubuntu:20.04 /strata build --help || true
          echo "compat ubuntu:20.04 OK (if this fails, set upx=False in strata.spec for that release)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Rename for release
        run: |
          ls -R dist/
          # artifacts are flat: strata / strata.exe — rename with OS suffix for release
          # download-artifact with merge-multiple puts each artifact's files directly in dist/
          # we need to discover which is which by checking existence after download
          # Simpler: re-list and move
          mkdir -p release/
          find dist -type f -name "strata*" | while read f; do
            echo "found $f"
            # keep original name, GH release will deduplicate by OS if we rename
            # Use artifact dir name is lost with merge-multiple, so infer by file type
            if [[ "$f" == *.exe ]]; then
              cp "$f" release/strata-windows-amd64.exe
            else
              # Distinguish linux vs macos by trying to detect Mach-O vs ELF
              if file "$f" | grep -q "Mach-O"; then
                cp "$f" release/strata-macos-amd64
              else
                cp "$f" release/strata-linux-amd64
              fi
            fi
          done
          ls -lh release/
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Patch Homebrew formula with real SHA256 + version
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/v}"
          LINUX_SHA=$(sha256sum release/strata-linux-amd64 | cut -d' ' -f1)
          MACOS_SHA=$(sha256sum release/strata-macos-amd64 | cut -d' ' -f1)
          echo "version=$VERSION linux=$LINUX_SHA macos=$MACOS_SHA"
          # homebrew formula lives at prototype/homebrew/strata-lang.rb from repo root
          # runner is at prototype/ subdir when workflows run from there — handle both
          FORMULA="homebrew/strata-lang.rb"
          if [ ! -f "$FORMULA" ]; then FORMULA="prototype/homebrew/strata-lang.rb"; fi
          sed -i "s/^  version \".*\"/  version \"$VERSION\"/" "$FORMULA"
          sed -i "s|/releases/download/v[^/]*|/releases/download/v$VERSION|g" "$FORMULA"
          sed -i "s/REPLACE_LINUX_SHA256/$LINUX_SHA/; s/REPLACE_MACOS_SHA256/$MACOS_SHA/" "$FORMULA"
          # fallback if placeholders already replaced in a previous tag (replace any 64-hex after sha256)
          if grep -q "REPLACE_" "$FORMULA"; then echo "::warning::placeholder still present in $FORMULA"; cat "$FORMULA"; fi
          echo "--- patched formula ---"
          cat "$FORMULA"
          # commit back to main only if this is a tag on main (avoid loop — workflow runs on tags)
          if git diff --quiet -- "$FORMULA"; then echo "no diff"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "chore(homebrew): bump $VERSION linux $LINUX_SHA macos $MACOS_SHA [skip ci]"
          git push origin HEAD:main || echo "::warning::push failed (branch protection?) — open PR manually with patched $FORMULA"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
