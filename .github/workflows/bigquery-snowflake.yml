name: bigquery-snowflake-integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'strata/adapters.py'
      - 'strata/dbcompat.py'
      - 'strata/dialects.py'
      - 'strata/sqlgen.py'
      - 'tests/test_sqlgen_bigquery.py'
      - 'tests/test_sqlgen_snowflake.py'
      - 'tests/test_exec_bigquery.py'
      - 'tests/test_exec_snowflake.py'
      - 'tests/bq_harness.py'
      - 'tests/sf_harness.py'
  pull_request:
    branches: [main]
    paths:
      - 'strata/adapters.py'
      - 'strata/dbcompat.py'
      - 'strata/dialects.py'
      - 'strata/sqlgen.py'
      - 'tests/test_sqlgen_bigquery.py'
      - 'tests/test_sqlgen_snowflake.py'
      - 'tests/test_exec_bigquery.py'
      - 'tests/test_exec_snowflake.py'
      - 'tests/bq_harness.py'
      - 'tests/sf_harness.py'

jobs:
  bigquery:
    name: BigQuery Integration Tests
    runs-on: ubuntu-latest
    # Emulator path (goccy/bigquery-emulator via Docker) runs by default; the
    # real-GCP path activates when the GCP_SERVICE_ACCOUNT_KEY / BIGQUERY_PROJECT
    # secrets are configured. Working with secrets in `if:` is only possible via
    # job-level env, hence the indirection.
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Authenticate with GCP
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Install strata + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bigquery]"

      - name: Run BigQuery SQL emission tests
        run: |
          pytest tests/test_sqlgen_bigquery.py -v --tb=short --no-cov

      - name: Run BigQuery engine execution tests
        run: |
          pytest tests/test_exec_bigquery.py -v --tb=short --no-cov

  snowflake:
    name: Snowflake Integration Tests
    runs-on: ubuntu-latest
    # LocalStack Snowflake emulator path requires LOCALSTACK_AUTH_TOKEN (licensed);
    # the real-Snowflake path activates when the SNOWFLAKE_* secrets are configured.
    # Both are exposed as job-level env so steps can gate on them.
    env:
      SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install strata + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,snowflake]"

      - name: Run Snowflake SQL emission tests
        run: |
          pytest tests/test_sqlgen_snowflake.py -v --tb=short --no-cov

      - name: Run Snowflake engine execution tests
        run: |
          pytest tests/test_exec_snowflake.py -v --tb=short --no-cov