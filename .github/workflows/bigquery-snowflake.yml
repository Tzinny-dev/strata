name: bigquery-snowflake-integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'strata/adapters.py'
      - 'strata/dbcompat.py'
      - 'strata/dialects.py'
      - 'strata/sqlgen.py'
      - 'tests/test_sqlgen_bigquery.py'
      - 'tests/test_sqlgen_snowflake.py'
      - 'tests/test_exec_bigquery.py'
      - 'tests/test_exec_snowflake.py'
      - 'tests/bq_harness.py'
      - 'tests/sf_harness.py'
  pull_request:
    branches: [main]
    paths:
      - 'strata/adapters.py'
      - 'strata/dbcompat.py'
      - 'strata/dialects.py'
      - 'strata/sqlgen.py'
      - 'tests/test_sqlgen_bigquery.py'
      - 'tests/test_sqlgen_snowflake.py'
      - 'tests/test_exec_bigquery.py'
      - 'tests/test_exec_snowflake.py'
      - 'tests/bq_harness.py'
      - 'tests/sf_harness.py'

jobs:
  bigquery:
    name: BigQuery Integration Tests
    runs-on: ubuntu-latest
    # Emulator path runs by default; the real-GCP path activates when the
    # GCP_SERVICE_ACCOUNT_KEY / BIGQUERY_PROJECT secrets are configured.
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install google-cloud-sdk (for BigQuery emulator)
        run: |
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
          sudo apt-get update -qq && sudo apt-get install -y -qq google-cloud-sdk

      - name: Authenticate with GCP
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up BigQuery emulator
        if: env.GCP_SA_KEY == ''
        run: |
          gcloud emulators bigquery start --host-port=localhost:9050 --project=strata-test &
          sleep 10

      - name: Install strata + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bigquery]"

      - name: Run BigQuery SQL emission tests
        run: |
          pytest tests/test_sqlgen_bigquery.py -v --tb=short

      - name: Run BigQuery engine execution tests
        run: |
          pytest tests/test_exec_bigquery.py -v --tb=short

  snowflake:
    name: Snowflake Integration Tests
    runs-on: ubuntu-latest
    # LocalStack emulator path runs by default; the real-Snowflake path
    # activates when the SNOWFLAKE_* secrets are configured.
    env:
      SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Start LocalStack Snowflake emulator
        if: env.SF_ACCOUNT == ''
        run: |
          docker pull localstack/localstack:latest
          docker run -d --rm \
            -p 4444:443 \
            -e SERVICES=snowflake \
            -e DEBUG=1 \
            --name localstack-snowflake \
            localstack/localstack:latest
          sleep 30

      - name: Install strata + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,snowflake]"

      - name: Run Snowflake SQL emission tests
        run: |
          pytest tests/test_sqlgen_snowflake.py -v --tb=short

      - name: Run Snowflake engine execution tests
        run: |
          pytest tests/test_exec_snowflake.py -v --tb=short