[mypy]
python_version = 3.10
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
allow_untyped_globals = true
ignore_missing_imports = true
disable_error_code = import-untyped
follow_imports = silent

# Scoped gate (blocking in CI). The dynamically-typed AST pipeline is OUT of
# mypy scope: parser/lexer/ast/types/grammar/gbnf model Node/Plan against
# `object` and optional values (`TypedModel.plan: Plan | None`), which fans out
# into union-attr/attr-defined noise in their consumers analysis/exec/sqlgen.
# Guarding those files against NameError/import/redefinition bugs is the job of
# the (blocking) ruff F-rules; typing the AST itself (Node/Plan) is tracked as
# a separate backlog item. Everything listed here MUST typecheck clean.
# follow_imports=silent keeps errors from excluded modules (pulled in via
# imports) from leaking into this gate.
files =
  strata/__init__.py,
  strata/__main__.py,
  strata/adapters.py,
  strata/bench.py,
  strata/cli.py,
  strata/dashboard.py,
  strata/dbcompat.py,
  strata/diagnostic.py,
  strata/dialects.py,
  strata/diff.py,
  strata/fmt.py,
  strata/functions.py,
  strata/iceberg.py,
  strata/importdbt.py,
  strata/integrations.py,
  strata/lint.py,
  strata/lsp.py,
  strata/observability.py,
  strata/seed.py,
  strata/utils.py,
  strata/commands